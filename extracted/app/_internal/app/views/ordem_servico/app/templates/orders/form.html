<link rel="stylesheet" href="{{ url_for('static', filename='css/forms-modern.css') }}?v=20260530-bold">
{% endblock %}

{% block content %}
<div class="form-container form-modern">
    <h2 class="mb-4">{{ 'Editar' if order else 'Nova' }} Ordem de Serviço</h2>
    
    <form method="POST" 
          action="{{ url_for('orders.edit', id=order.id) if order else url_for('orders.from_client', client_id=client.id) if client else url_for('orders.add') }}" 
          class="needs-validation" 
          id="orderForm"
          novalidate>
        
        <!-- Alertas -->
        <div id="alertContainer"></div>
        
        <!-- Cliente -->
        <div class="form-group mb-3">
            <label for="client_search">Cliente *</label>
            <div class="input-group client-field">
                {% if order or client %}
                    <input type="text" class="form-control" id="client_search" 
                           value="{{ order.client.name if order else client.name }}" readonly>
                    <input type="hidden" name="client_id" id="client_id" 
                           value="{{ order.client_id if order else client.id }}" required>
                {% else %}
                    <div class="input-group">
                        <input type="text" class="form-control" id="client_search" 
                               placeholder="Digite nome, {% if locale and locale.code == 'PT' %}NIF{% elif locale and locale.code == 'US' %}SSN/EIN{% else %}CPF/CNPJ{% endif %} ou telefone do cliente" required>
                        <input type="hidden" name="client_id" id="client_id" required>
                        <button type="button" class="btn btn-outline-primary" id="addClientBtn">
                            <i class="fas fa-plus"></i> Novo Cliente
                        </button>
                    </div>
                    <div class="form-text">
                        Digite pelo menos 3 caracteres para buscar um cliente. A busca funciona por nome, {% if locale and locale.code == 'PT' %}NIF{% elif locale and locale.code == 'US' %}SSN/EIN{% else %}CPF/CNPJ{% endif %} ou telefone.
                    </div>
                    <div class="invalid-feedback">
                        Cliente não encontrado ou inválido. Por favor, selecione um cliente da lista ou cadastre um novo cliente.
                    </div>
                    <div id="clientDetails" class="mt-2 d-none">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">Detalhes do Cliente</h6>
                                <p class="card-text">
                                    <strong>Documento:</strong> <span id="clientDocument"></span><br>
                                    <strong>Telefone:</strong> <span id="clientPhone"></span><br>
                                    <strong>Email:</strong> <span id="clientEmail"></span><br>
                                    <strong>Endereço:</strong> <span id="clientAddress"></span>
                                </p>
                            </div>
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>

        <!-- Tipo de Serviço -->
        <div class="form-group mb-3">
            <label for="service_type_id">Tipo de Serviço</label>
            <div class="input-group service-type-group">
                <select class="form-control" id="service_type_id" name="service_type_id">
                    <option value="">Selecione um tipo de serviço</option>
                    {% for type in service_types %}
                        <option value="{{ type.id }}" 
                                data-description="{{ type.description }}"
                                data-warranty="{{ type.default_warranty }}"
                                {% if order and order.service_type_id == type.id %}selected{% endif %}>
                            {{ type.name }}
                        </option>
                    {% endfor %}
                </select>
                <button type="button" class="btn" id="serviceTypeInfo" disabled>
                    INFO
                </button>
                <a href="{{ url_for('settings.service_types') }}" class="btn btn-outline-secondary">
                    <i class="fas fa-cog"></i><span class="button-text">Gerenciar</span>
                </a>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" 
                        data-bs-target="#serviceTypeModal">
                    <i class="fas fa-plus"></i><span class="button-text">Novo</span>
                </button>
            </div>
        </div>

        <!-- Equipamento -->
        <div class="form-group mb-3">
            <label for="equipment">Equipamento *</label>
            <input type="text" class="form-control" id="equipment" name="equipment" 
                   value="{{ order.equipment if order else '' }}" 
                   list="equipmentList" required data-combobox
                   placeholder="Digite o tipo de equipamento (ex: Smartphone, Notebook, etc)">
            <datalist id="equipmentList">
                <option value="Smartphone">
                <option value="iPhone">
                <option value="Notebook">
                <option value="PC / Computador">
                <option value="Tablet">
                <option value="iPad">
                <option value="Smart TV">
                <option value="Monitor">
                <option value="Impressora">
                <option value="Video Game">
                <option value="Playstation">
                <option value="Xbox">
                <option value="Nintendo Switch">
                <option value="Drone">
                <option value="Placa de Vídeo">
                <option value="Placa-Mãe">
                <option value="Fonte de Alimentação">
                <option value="Câmera Digital">
                <option value="Câmera de Segurança">
                <option value="Projetor">
                <option value="Roteador">
                <option value="Nobreak">
                <option value="All in One">
                <option value="Smartwatch">
                <option value="GPS">
                <option value="Som Automotivo">
                <option value="Central Multimídia">
            </datalist>
            <div class="form-text">
                Digite ou selecione o tipo de equipamento
            </div>
            <div class="invalid-feedback">
                Por favor, informe o equipamento.
            </div>
        </div>

        <!-- Prioridade -->
        <div class="mb-3">
            <label for="priority" class="form-label">Prioridade *</label>
            <select class="form-select" id="priority" name="priority" required>
                <option value="baixa" {% if order and order.priority == 'baixa' %}selected{% endif %}>Baixa</option>
                <option value="media" {% if order and order.priority == 'media' %}selected{% endif %}>Média</option>
                <option value="alta" {% if order and order.priority == 'alta' %}selected{% endif %}>Alta</option>
            </select>
            <div class="invalid-feedback">
                Por favor, selecione a prioridade.
            </div>
        </div>

        <!-- Outros campos -->
        <div class="row">
            <div class="col-md-4">
                <div class="form-group mb-3">
                    <label for="brand">Marca</label>
                    <input type="text" class="form-control" id="brand" name="brand" 
                           value="{{ order.brand if order else '' }}"
                           list="brandsList" data-combobox
                           placeholder="Digite a marca do equipamento">
                    <datalist id="brandsList">
                        <!-- Smartphones e Tablets -->
                        <option value="Samsung">
                        <option value="Apple">
                        <option value="Xiaomi">
                        <option value="Motorola">
                        <option value="LG">
                        <option value="Asus">
                        <option value="Huawei">
                        <option value="OnePlus">
                        <option value="Sony">
                        <option value="Nokia">
                        <option value="Realme">
                        <option value="OPPO">
                        <option value="Vivo">
                        <!-- Computadores e Notebooks -->
                        <option value="Dell">
                        <option value="HP">
                        <option value="Lenovo">
                        <option value="Acer">
                        <option value="MSI">
                        <option value="Vaio">
                        <option value="Positivo">
                        <option value="Microsoft">
                        <!-- TVs -->
                        <option value="TCL">
                        <option value="AOC">
                        <option value="Philips">
                        <option value="Philco">
                        <option value="Panasonic">
                        <option value="Toshiba">
                        <!-- Componentes -->
                        <option value="Intel">
                        <option value="AMD">
                        <option value="NVIDIA">
                        <option value="Gigabyte">
                        <option value="ASRock">
                        <option value="Corsair">
                        <option value="Kingston">
                        <option value="Western Digital">
                        <option value="Seagate">
                        <!-- Impressoras -->
                        <option value="Epson">
                        <option value="Canon">
                        <option value="Brother">
                        <!-- Outros -->
                        <option value="DJI">
                        <option value="GoPro">
                        <option value="Logitech">
                        <option value="HyperX">
                        <option value="Razer">
                    </datalist>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group mb-3">
                    <label for="model">Modelo</label>
                    <input type="text" class="form-control" id="model" name="model" 
                           value="{{ order.model if order else '' }}"
                           placeholder="Digite o modelo do equipamento">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group mb-3">
                    <label for="serial_number">Número de Série</label>
                    <input type="text" class="form-control" id="serial_number" name="serial_number" 
                           value="{{ order.serial_number if order else '' }}"
                           placeholder="Digite o número de série (se disponível)">
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="technician_id" class="form-label">Técnico Responsável</label>
                    <select class="form-select" id="technician_id" name="technician_id">
                        <option value="">Opcional - Pode ser selecionado no encerramento da OS</option>
                        {% for technician in technicians %}
                        <option value="{{ technician.id }}" 
                                {% if order and order.technician_id == technician.id %}selected{% endif %}>
                            {{ technician.name }} ({{ technician.commission_rate }}%)
                        </option>
                        {% endfor %}
                    </select>
                    <div class="form-text text-muted">
                        <i class="fas fa-info-circle"></i> O técnico pode ser designado posteriormente durante o andamento da OS
                    </div>
                </div>
            </div>
        </div>

        <!-- Problema -->
        <div class="form-group mb-3">
            <label for="problem">Problema Relatado *</label>
            <textarea class="form-control" id="problem" name="problem" rows="3" required
                      placeholder="Descreva detalhadamente o problema relatado pelo cliente. Ex: Equipamento não liga, tela quebrada, etc.">{{ order.problem if order else '' }}</textarea>
            <div class="invalid-feedback">
                Por favor, descreva o problema relatado.
            </div>
        </div>

        <!-- Observações -->
        <div class="form-group mb-3">
            <label for="observations">Observações</label>
            <textarea class="form-control" id="observations" name="observations" rows="3"
                      placeholder="IMPORTANTE: Registre aqui detalhes como:&#13;&#10;• Estado do equipamento (arranhões, marcas de uso, etc.)&#13;&#10;• Acessórios deixados pelo cliente&#13;&#10;• Senhas fornecidas&#13;&#10;• Outras informações relevantes">{{ order.observations if order else '' }}</textarea>
            <div class="form-text text-muted">
                <i class="fas fa-info-circle"></i> Registre informações importantes sobre o estado do equipamento e acessórios
            </div>
        </div>

        

        <!-- Botões -->
        <div class="fixed-save-button">
            <button type="submit" class="btn btn-primary" id="submitBtn">
                <i class="fas fa-save"></i> {{ 'Salvar Alterações' if order else 'Criar Ordem de Serviço' }}
            </button>
        </div>

    </form>
</div>

<!-- Modal para Novo Tipo de Serviço -->
<div class="modal fade" id="serviceTypeModal" tabindex="-1" aria-labelledby="serviceTypeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="serviceTypeModalLabel">Novo Tipo de Serviço</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Alertas -->
                <div id="serviceTypeAlerts"></div>
                
                <div class="mb-3">
                    <label for="serviceTypeName" class="form-label">Nome *</label>
                    <input type="text" class="form-control" id="serviceTypeName" required
                           placeholder="Digite o nome do tipo de serviço">
                    <div class="invalid-feedback">
                        Por favor, informe o nome do tipo de serviço.
                    </div>
                </div>
                <div class="mb-3">
                    <label for="serviceTypeDescription" class="form-label">Descrição</label>
                    <textarea class="form-control" id="serviceTypeDescription" rows="2"
                             placeholder="Descreva os detalhes deste tipo de serviço"></textarea>
                </div>
                <div class="mb-3">
                    <label for="serviceTypeWarranty" class="form-label">Garantia (dias)</label>
                    <input type="number" class="form-control" id="serviceTypeWarranty" min="0" value="0"
                           placeholder="Quantidade de dias de garantia">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="saveQuickServiceType">
                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    <span class="button-text">Salvar</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Informações do Tipo de Serviço -->
<div class="modal fade" id="serviceTypeInfoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Detalhes do Tipo de Serviço</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Modo Visualização -->
                <div id="viewMode">
                    <div class="mb-3">
                        <h6>Nome</h6>
                        <p id="infoServiceTypeName" class="text-muted"></p>
                    </div>
                    <div class="mb-3">
                        <h6>Descrição</h6>
                        <p id="infoServiceTypeDescription" class="text-muted"></p>
                    </div>
                    <div class="mb-3">
                        <h6>Garantia</h6>
                        <p id="infoServiceTypeWarranty" class="text-muted"></p>
                    </div>
                </div>
                
                <!-- Modo Edição -->
                <div id="editMode" style="display: none;">
                    <div class="mb-3">
                        <label class="form-label">Nome *</label>
                        <input type="text" class="form-control" id="editServiceTypeName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-control" id="editServiceTypeDescription" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Garantia (dias)</label>
                        <input type="number" class="form-control" id="editServiceTypeWarranty" min="0">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <!-- Botões do Modo Visualização -->
                <div id="viewModeButtons">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary" id="editModeBtn">
                        <i class="fas fa-edit"></i> Editar
                    </button>
                </div>
                <!-- Botões do Modo Edição -->
                <div id="editModeButtons" style="display: none;">
                    <button type="button" class="btn btn-secondary" id="cancelEdit">Cancelar</button>
                    <button type="button" class="btn btn-success" id="saveEdit">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/combobox.js') }}?v=20260529"></script>
<script>
// Funções globais
function updateItemPrice(row) {
    if (!row) return; // Se a linha não existir, retorna sem fazer nada
    
    const select = row.querySelector('.item-select');
    const quantityInput = row.querySelector('.item-quantity');
    const priceSpan = row.querySelector('.item-price');
    
    if (!select || !priceSpan) return; // Se elementos necessários não existirem, retorna
    
    const quantity = parseFloat(quantityInput?.value) || 0;
    
    if (select.value) {
        const option = select.options[select.selectedIndex];
        const price = parseFloat(option?.dataset?.price) || 0;
        const total = price * quantity;
        priceSpan.textContent = total.toFixed(2);
    } else {
        priceSpan.textContent = '0.00';
    }
    
    // Só chama updateTotalPrice se houver itens no inventário
    const inventoryItems = document.getElementById('inventory-items');
    if (inventoryItems && inventoryItems.children.length > 0) {
        updateTotalPrice();
    }
}

// Função para atualizar a numeração dos itens
function updateItemNumbers() {
    const items = document.querySelectorAll('.inventory-item');
    items.forEach((item, index) => {
        const numberSpan = item.querySelector('.item-number');
        if (numberSpan) {
            numberSpan.textContent = (index + 1).toString();
        }
    });
}

// Função para atualizar o preço total
function updateTotalPrice() {
    let total = 0;
    const items = document.querySelectorAll('.item-price');
    items.forEach(item => {
        total += parseFloat(item.textContent) || 0;
    });
    const totalElement = document.getElementById('total-price');
    if (totalElement) {
        totalElement.textContent = total.toFixed(2);
    }
}

// Inicialização quando o documento estiver pronto
$(document).ready(function() {
    const form = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertContainer = document.getElementById('alertContainer');
    
    // Função para mostrar alerta
    function showAlert(message, type = 'error') {
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.addEventListener('mouseenter', Swal.stopTimer)
                toast.addEventListener('mouseleave', Swal.resumeTimer)
            }
        });

        Toast.fire({
            icon: type === 'danger' ? 'error' : type,
            title: message
        });
    }

    // Evento de submit do formulário
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (!form.checkValidity()) {
            e.stopPropagation();
            showAlert('Por favor, preencha todos os campos obrigatórios.', 'error');
            form.classList.add('was-validated');
            return;
        }

        // Desabilita o botão de submit para evitar duplo envio
        submitBtn.disabled = true;
        
        // Mostra loading com SweetAlert2
        Swal.fire({
            title: 'Salvando...',
            text: 'Por favor, aguarde enquanto salvamos a ordem de serviço.',
            allowOutsideClick: false,
            allowEscapeKey: false,
            showConfirmButton: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });
        
        // Envia o formulário via AJAX
        $.ajax({
            url: form.action,
            method: form.method,
            data: $(form).serialize(),
            success: function(response) {
                Swal.close(); // Fecha o loading
                
                if (response.success) {
                    const orderId = response.order_id;
                    if (!orderId && response.redirect_url) {
                        window.location.href = response.redirect_url;
                        return;
                    }
                    if (!orderId) {
                        Swal.fire({
                            title: 'Erro!',
                            text: 'ID da ordem não encontrado na resposta',
                            icon: 'error',
                            confirmButtonColor: '#dc3545'
                        });
                        return;
                    }

                    // Prepara as URLs
                    const pdfUrl = `{{ url_for('reports.service_order_pdf', id='0', type='recebimento') }}`.replace('0', orderId);
                    const checklistUrl = `{{ url_for('checklists.new_checklist', order_id='0', type='entrada') }}`.replace('0', orderId);
                    const listUrl = `{{ url_for('orders.list') }}`;

                    // Pergunta o que o usuário deseja fazer
                    Swal.fire({
                        title: 'Ordem de Serviço Salva!',
                        text: 'O que você deseja fazer agora?',
                        icon: 'success',
                        showDenyButton: true,
                        showCancelButton: true,
                        confirmButtonText: 'Gerar PDF',
                        denyButtonText: 'Ir para Checklist',
                        cancelButtonText: 'Voltar para Lista',
                        confirmButtonColor: '#28a745',
                        denyButtonColor: '#17a2b8',
                        cancelButtonColor: '#6c757d'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // Pergunta se quer visualizar ou baixar o PDF
                            Swal.fire({
                                title: 'PDF de Recebimento',
                                text: 'Como você deseja abrir o PDF?',
                                icon: 'question',
                                showDenyButton: true,
                                confirmButtonText: 'Visualizar',
                                denyButtonText: 'Download',
                                confirmButtonColor: '#28a745',
                                denyButtonColor: '#17a2b8'
                            }).then((pdfResult) => {
                                if (pdfResult.isConfirmed) {
                                    // Visualizar PDF
                                    handlePDF(pdfUrl, false);
                                } else if (pdfResult.isDenied) {
                                    // Download PDF
                                    handlePDF(pdfUrl, true);
                                }
                                
                                // Após gerar o PDF, pergunta sobre o checklist
                                setTimeout(() => {
                                    Swal.fire({
                                        title: 'Checklist de Entrada',
                                        text: 'Deseja preencher o checklist de entrada?',
                                        icon: 'question',
                                        showCancelButton: true,
                                        confirmButtonText: 'Sim, preencher',
                                        cancelButtonText: 'Não',
                                        confirmButtonColor: '#28a745',
                                        cancelButtonColor: '#6c757d'
                                    }).then((checkResult) => {
                                        if (checkResult.isConfirmed) {
                                            window.location.href = checklistUrl;
                                        } else {
                                            window.location.href = listUrl;
                                        }
                                    });
                                }, 1000);
                            });
                        } else if (result.isDenied) {
                            // Vai direto para o checklist
                            window.location.href = checklistUrl;
                        } else {
                            // Volta para a lista
                            window.location.href = listUrl;
                        }
                    });
                } else {
                    Swal.fire({
                        title: 'Erro!',
                        text: response.message || 'Erro ao salvar a ordem de serviço.',
                        icon: 'error',
                        confirmButtonColor: '#dc3545'
                    });
                    submitBtn.disabled = false;
                }
            },
            error: function(xhr) {
                console.error('AJAX Error:', xhr);
                setTimeout(() => {
                    Swal.close();
                    Swal.fire({
                        title: 'Erro!',
                        text: xhr.responseJSON?.message || 'Erro ao gerar PDF',
                        icon: 'error',
                        confirmButtonColor: '#dc3545'
                    });
                }, 500);
            }
        });
    });

    // Inicializa os caches
    let brandCache = initializeLocalCache('brandCache');
    let modelCache = initializeLocalCache('modelCache');

    // Configura o autocomplete para o campo de marca
    $("#brand").autocomplete({
        source: function(request, response) {
            response(getSuggestions(brandCache, request.term));
        },
        minLength: 1,
        select: function(event, ui) {
            updateLocalCache('brandCache', ui.item.value);
        },
        change: function(event, ui) {
            if (ui.item == null && $(this).val() != '') {
                updateLocalCache('brandCache', $(this).val());
            }
        }
    }).on('blur', function() {
        if ($(this).val() != '') {
            updateLocalCache('brandCache', $(this).val());
        }
    });

    // Configura o autocomplete para o campo de modelo
    $("#model").autocomplete({
        source: function(request, response) {
            response(getSuggestions(modelCache, request.term));
        },
        minLength: 1,
        select: function(event, ui) {
            updateLocalCache('modelCache', ui.item.value);
        },
        change: function(event, ui) {
            if (ui.item == null && $(this).val() != '') {
                updateLocalCache('modelCache', $(this).val());
            }
        }
    }).on('blur', function() {
        if ($(this).val() != '') {
            updateLocalCache('modelCache', $(this).val());
        }
    });

    // Botão de cadastro de cliente
    $("#addClientBtn").click(function() {
        window.location.href = "{{ url_for('clients.add') }}?return_to_order=true";
    });

    // Validação do formulário
    (function() {
        'use strict';
        window.addEventListener('load', function() {
            var forms = document.getElementsByClassName('needs-validation');
            var validation = Array.prototype.filter.call(forms, function(form) {
                form.addEventListener('submit', function(event) {
                    if (form.checkValidity() === false) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        }, false);
    })();

    // Inicializa os itens existentes
    const existingItems = document.querySelectorAll('.inventory-item');
    existingItems.forEach(row => {
        setupItemEvents(row);
    });

    // Inicializa a numeração e total
    updateItemNumbers();
    updateTotalPrice();

    // Função para mostrar alerta no modal
    function showServiceTypeAlert(message, type = 'danger') {
        const Toast = Swal.mixin({
            toast: true,
            position: 'top',

    // Função para habilitar/desabilitar o formulário do modal
    function toggleServiceTypeForm(disabled) {
        const modal = document.getElementById('serviceTypeModal');
        const saveBtn = document.getElementById('saveQuickServiceType');
        
        if (!modal || !saveBtn) {
            console.error('Elementos do modal não encontrados');
            return;
        }
        
        const inputs = modal.querySelectorAll('input, textarea, select, button');
        const spinner = saveBtn.querySelector('.spinner-border');
        const buttonText = saveBtn.querySelector('.button-text');
        
        if (!spinner || !buttonText) {
            console.error('Elementos do botão não encontrados');
            return;

        inputs.forEach(input => {
            if (input !== saveBtn) {
                input.disabled = disabled;

            option.dataset.description = newType.description || '';
            option.dataset.warranty = newType.default_warranty || '0';

            // Remove opções antigas com mesmo valor se existirem
            const existingOption = select.querySelector(`option[value="${newType.id}"]`);
            if (existingOption) {
                existingOption.remove();
            }

            // Adiciona a nova opção

            // Dispara os eventos necessários

    // Função para fechar o modal com segurança
    async function closeModalSafely(modalElement) {
        return new Promise((resolve) => {
            if (!modalElement) {
                resolve();
                return;
            }

            const modal = bootstrap.Modal.getInstance(modalElement);
            if (!modal) {
                resolve();
                return;
            }

            modalElement.addEventListener('hidden.bs.modal', function onHidden() {
                modalElement.removeEventListener('hidden.bs.modal', onHidden);
                resolve();
            }, { once: true });

            modal.hide();
        });
    }

// Função para lidar com PDF
function handlePDF(url, download) {
    console.log('handlePDF called with url:', url, 'download:', download);
    
    Swal.fire({
        title: 'Gerando PDF...',
        text: 'Por favor, aguarde enquanto geramos o documento.',
        allowOutsideClick: false,
        allowEscapeKey: false,
        showConfirmButton: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });

    // Adiciona um pequeno delay para dar tempo de ver os logs
    setTimeout(() => {
        $.get(url)
            .done(function(response) {
                console.log('Response received:', response);
                
                // Aguarda um pouco antes de fechar o loading
                setTimeout(() => {
                    Swal.close();
                    
                    try {
                        // Se a resposta for string, tenta fazer parse
                        if (typeof response === 'string') {
                            response = JSON.parse(response);
                        }
                        
                        // Verifica se temos uma URL do PDF (seja via success ou direto)
                        if (response.success && response.pdf_url) {
                            console.log('PDF URL found:', response.pdf_url);
                            if (download) {
                                // Para download, cria um link temporário e clica nele
                                const link = document.createElement('a');
                                link.href = response.pdf_url;
                                link.download = response.pdf_url.split('/').pop();
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                                console.log('Download completed');
                            } else {
                                // Para visualização, abre em uma nova janela
                                window.open(response.pdf_url, '_blank');
                                console.log('View window opened');
                            }
                        } else if (response.url) { // Tenta formato alternativo
                            console.log('Direct URL found:', response.url);
                            if (download) {
                                const link = document.createElement('a');
                                link.href = response.url;
                                link.download = response.url.split('/').pop();
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                                console.log('Download completed (direct URL)');
                            } else {
                                window.open(response.url, '_blank');
                                console.log('View window opened (direct URL)');
                            }
                        } else {
                            console.error('No PDF URL found in response:', response);
                            throw new Error('URL do PDF não encontrada na resposta');
                        }
                    } catch (error) {
                        console.error('Error processing response:', error);
                Swal.fire({
                    title: 'Erro!',
                            text: error.message || 'Erro ao processar resposta do PDF',
                            icon: 'error',
                            confirmButtonColor: '#dc3545'
                        });
                    }
                }, 500); // Delay antes de fechar o loading
            })
            .fail(function(xhr) {
                console.error('AJAX Error:', xhr);
                setTimeout(() => {
                    Swal.close();
                    Swal.fire({
                        title: 'Erro!',
                        text: xhr.responseJSON?.message || 'Erro ao gerar PDF',
                        icon: 'error',
                        confirmButtonColor: '#dc3545'
                    });
                }, 500);
            });
    }, 500); // Delay inicial
}

// Função para inicializar o cache local
function initializeLocalCache(key) {
    try {
        const cache = localStorage.getItem(key);
        if (!cache) return { items: [], frequencies: {} };
        
        const data = JSON.parse(cache);
        // Migração de dados antigos
        if (Array.isArray(data)) {
            return {
                items: data.map(item => ({
                    value: item,
                    timestamp: Date.now(),
                    frequency: 1
                })),
                frequencies: data.reduce((acc, item) => {
                    acc[item] = 1;
                    return acc;
                }, {})
            };
        }
        return data;
    } catch (e) {
        console.error('Erro ao inicializar cache:', e);
        return { items: [], frequencies: {} };
    }
}

// Função para atualizar o cache local
function updateLocalCache(key, value) {
    try {
        const MAX_CACHE_ITEMS = 100; // Limite máximo de itens no cache
        let cache = initializeLocalCache(key);
        
        // Atualiza ou adiciona o item
        const existingItemIndex = cache.items.findIndex(item => 
            item.value.toLowerCase() === value.toLowerCase()
        );
        
        if (existingItemIndex > -1) {
            // Atualiza item existente
            cache.items[existingItemIndex].timestamp = Date.now();
            cache.items[existingItemIndex].frequency = (cache.items[existingItemIndex].frequency || 0) + 1;
            cache.frequencies[value] = cache.items[existingItemIndex].frequency;
        } else {
            // Adiciona novo item
            cache.items.push({
                value: value,
                timestamp: Date.now(),
                frequency: 1
            });
            cache.frequencies[value] = 1;
            
            // Remove itens mais antigos se exceder o limite
            if (cache.items.length > MAX_CACHE_ITEMS) {
                // Ordena por frequência e timestamp
                cache.items.sort((a, b) => {
                    if (a.frequency === b.frequency) {
                        return b.timestamp - a.timestamp;
                    }
                    return b.frequency - a.frequency;
                });
                
                // Remove os itens excedentes
                cache.items = cache.items.slice(0, MAX_CACHE_ITEMS);
                
                // Atualiza frequencies
                cache.frequencies = cache.items.reduce((acc, item) => {
                    acc[item.value] = item.frequency;
                    return acc;
                }, {});
            }
        }
        
        localStorage.setItem(key, JSON.stringify(cache));
    } catch (e) {
        console.error('Erro ao atualizar cache:', e);
    }
}

// Função para buscar sugestões do cache
function getSuggestions(cache, term) {
    const matches = cache.items
        .filter(item => item.value.toLowerCase().includes(term.toLowerCase()))
        .sort((a, b) => {
            // Prioriza correspondências exatas
            const aExact = a.value.toLowerCase() === term.toLowerCase();
            const bExact = b.value.toLowerCase() === term.toLowerCase();
            if (aExact !== bExact) return bExact - aExact;
            
            // Depois ordena por frequência
            if (a.frequency !== b.frequency) {
                return b.frequency - a.frequency;
            }
            
            // Por fim, ordena por timestamp
            return b.timestamp - a.timestamp;
        })
        .map(item => ({
            label: `${item.value} (${item.frequency}x)`,
            value: item.value
        }));
    
    return matches;
}
