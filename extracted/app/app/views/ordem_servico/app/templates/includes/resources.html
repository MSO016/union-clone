{% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config['SYSTEM_NAME'] }}</title>

    <!-- Bootstrap 5.1.3 Core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- jQuery UI CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <!-- Datepicker CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    
    <!-- FullCalendar CSS (v6.x não usa arquivos CSS separados - estilos são embutidos no JS) -->
    <!-- REMOVIDO: URLs inválidas que causavam erro 404 -->
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/icon.ico') }}" type="image/x-icon">
    <link rel="icon" href="{{ url_for('static', filename='img/icon.ico') }}" type="image/x-icon">
    
    {% block extra_css %}{% endblock %}
{% endblock %}

{% block scripts %}
    <!-- jQuery Core -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Datepicker with PT-BR locale -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/locales/bootstrap-datepicker.pt-BR.min.js"></script>
    
    <!-- QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <!-- Application Specific JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom.js') }}"></script>
    
    <!-- FullCalendar JS (v6.x usa index.global.min.js) -->
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.8/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.8/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/timegrid@6.1.8/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/list@6.1.8/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.8/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.8/locales/pt-br.global.min.js'></script>
    
    <!-- QR Code Scanner Utils -->
    <script>
        window.QrCodeScanner = {
            scanner: null,
            
            // Inicializa o scanner com opções personalizadas
            init: function(containerId, onSuccess, config = {}) {
                const defaultConfig = {
                    fps: 10,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0,
                    showTorchButtonIfSupported: true,
                    showZoomSliderIfSupported: true,
                    defaultZoomValueIfSupported: 2
                };
                
                const finalConfig = { ...defaultConfig, ...config };
                
                // Se já existe um scanner, para ele
                if (this.scanner) {
                    this.scanner.stop();
                }
                
                this.scanner = new Html5Qrcode(containerId);
                
                // Tenta primeiro a câmera traseira (para dispositivos móveis)
                this.scanner.start(
                    { facingMode: "environment" },
                    finalConfig,
                    onSuccess,
                    (errorMessage) => {
                        console.log(errorMessage);
                        // Se falhar com a câmera traseira, tenta a frontal
                        if (errorMessage.includes("NotFoundError")) {
                            this.scanner.start(
                                { facingMode: "user" },
                                finalConfig,
                                onSuccess,
                                (error) => console.error(error)
                            );
                        }
                    }
                );
            },
            
            // Para o scanner
            stop: function() {
                if (this.scanner) {
                    return this.scanner.stop().then(() => {
                        this.scanner = null;
                    });
                }
                return Promise.resolve();
            }
        };
    </script>
    
    <!-- Initialize Components -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Tooltips
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl)
            });

            // Initialize Popovers
            var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
            var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
                return new bootstrap.Popover(popoverTriggerEl)
            });

            // Initialize Datepicker
            $('.datepicker').datepicker({
                format: 'dd/mm/yyyy',
                language: 'pt-BR',
                autoclose: true,
                todayHighlight: true
            });

            // Form validation
            document.querySelectorAll('form.needs-validation').forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                });
            });

            // Utility Functions
            window.formatMoney = function(value) {
                return new Intl.NumberFormat('pt-BR', {
                    style: 'currency',
                    currency: 'BRL'
                }).format(value);
            };

            window.formatDate = function(date) {
                return new Intl.DateTimeFormat('pt-BR').format(new Date(date));
            };

            window.showAlert = function(type, message) {
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
                alertDiv.innerHTML = `
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                `;
                document.querySelector('.container-fluid').insertAdjacentElement('afterbegin', alertDiv);
                
                setTimeout(() => alertDiv.remove(), 5000);
            };
        });
    </script>
    
    {% block extra_js %}{% endblock %}
{% endblock %}
